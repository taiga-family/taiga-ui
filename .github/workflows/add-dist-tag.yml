name: 🤖 Add npm dist-tag
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
      tag:
        description: Dist-tag to assign
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  add-dist-tag:
    name: Add dist-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/actions/setup-node@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      # TODO: remove once `taiga-family/actions/setup-npm` restores TLS verification itself
      - name: Restore TLS certificate validation
        run: npm config set strict-ssl true
      - uses: taiga-family/actions/setup-npm@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      # npm dist-tag via trusted publishing (OIDC) requires npm >= 11.21.0
      - run: npm install --global npm@^11.21.0

      - name: Add dist-tag for all packages
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          packages=(
            addon-charts
            addon-commerce
            addon-doc
            addon-mobile
            addon-table
            cdk
            core
            experimental
            i18n
            icons
            kit
            layout
            legacy
            styles
            testing
          )

          for pkg in "${packages[@]}"; do
            echo "Add dist-tag '$TAG' for @taiga-ui/$pkg@$VERSION"
            npm dist-tag add "@taiga-ui/$pkg@$VERSION" "$TAG"
          done

          echo "Add dist-tag '$TAG' for taiga-ui@$VERSION"
          npm dist-tag add "taiga-ui@$VERSION" "$TAG"
