name: ⚠️ Publish Taiga UI packages
on:
  push:
    branches: ['release/*']
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 1-5' # Canary at UTC 20:00 (MSK 23:00) on every day-of-week from Monday through Friday

# single workflow for all publish jobs: npm trusted publishing is configured per workflow file
permissions:
  contents: read

env:
  NX_DISABLE_NX_CACHE: true
  NX_DISABLE_REMOTE_CACHE: true

jobs:
  publish:
    name: Publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiga-family/actions/setup-variables@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      - uses: taiga-family/actions/setup-node@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      # TODO: remove once `taiga-family/actions/setup-npm` restores TLS verification itself
      - name: Restore TLS certificate validation
        run: npm config set strict-ssl true
      - uses: taiga-family/actions/setup-npm@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0

      - run: npx nx run-many -t publish

      - uses: taiga-family/actions/read-package-json@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
        id: info

  # separate job without `id-token: write`: third-party steps must not be able to request the npm OIDC token
  announce:
    name: Announce
    needs: publish
    # announcement is not a part of the release: never block merge of a release PR
    if: ${{ !contains(needs.publish.outputs.version, 'rc') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Announce to Time messenger
        uses: taiga-family/actions/messenger-mattermost-announce@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
        continue-on-error: true
        with:
          url: ${{ secrets.ANNOUNCE_WEBHOOK }}
          channel: ${{ secrets.ANNOUNCE_TARGET }}
          version: v${{ needs.publish.outputs.version }}
          ca-cert: ${{ secrets.ANNOUNCE_CA_CERT }}

      - name: Announce to Telegram messenger
        uses: taiga-family/actions/messenger-telegram-announce@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
        continue-on-error: true
        with:
          chatId: ${{ secrets.TAIGA_TELEGRAM_CHAT_ID }}
          topicId: ${{ secrets.TAIGA_TELEGRAM_CHAT_THREAD_ID }}
          token: ${{ secrets.TAIGA_TELEGRAM_BOT_TOKEN }}
          version: v${{ needs.publish.outputs.version }}
          textLink: '@taiga-ui/cdk'

  publish-canary:
    name: Publish canary
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/actions/setup-variables@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      - uses: taiga-family/actions/setup-node@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      # TODO: remove once `taiga-family/actions/setup-npm` restores TLS verification itself
      - name: Restore TLS certificate validation
        run: npm config set strict-ssl true
      - uses: taiga-family/actions/setup-npm@81cb55a2c1685e45ea591772e6bc9fd1d6b83765 # v2.24.0
      - run: npx ts-node ./scripts/publish-canary.ts

concurrency:
  # separate groups: a canary run must never cancel an in-progress release on the same ref
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'release' || 'canary' }}
  cancel-in-progress: true
