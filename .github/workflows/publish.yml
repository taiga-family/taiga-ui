name: ⚠️ Publish Taiga UI packages
on:
  push:
    branches: ['release/*']

permissions:
  contents: read

env:
  NX_DISABLE_NX_CACHE: true
  NX_DISABLE_REMOTE_CACHE: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiga-family/actions/setup-variables@9b6ebca664f44d0fc34a50bec5f85becdf27d388 # v2.12.0
      - uses: taiga-family/actions/setup-node@9b6ebca664f44d0fc34a50bec5f85becdf27d388 # v2.12.0
      - uses: taiga-family/actions/setup-npm@9b6ebca664f44d0fc34a50bec5f85becdf27d388 # v2.12.0
        with:
          token: ${{ secrets.TAIGA_UI_SCOPE_NPM_TOKEN }}

      - run: npx nx run-many -t publish

      - uses: taiga-family/actions/read-package-json@9b6ebca664f44d0fc34a50bec5f85becdf27d388 # v2.12.0
        id: info

      - name: Announce to Time messenger
        uses: taiga-family/actions/messenger-mattermost-announce@c3c5b1dafd967e96aadf1cd4d589bd57fab81d43 # v2.18.0
        # announcement is not a part of the release: never block merge of a release PR
        continue-on-error: true
        if: ${{ !contains(steps.info.outputs.version, 'rc') }}
        with:
          url: ${{ secrets.ANNOUNCE_WEBHOOK }}
          channel: ${{ secrets.ANNOUNCE_TARGET }}
          version: v${{ steps.info.outputs.version }}
          ca-cert: ${{ secrets.ANNOUNCE_CA_CERT }}

      - name: Announce to Telegram messenger
        uses: taiga-family/actions/messenger-telegram-announce@9b6ebca664f44d0fc34a50bec5f85becdf27d388 # v2.12.0
        # announcement is not a part of the release: never block merge of a release PR
        continue-on-error: true
        if: ${{ !contains(steps.info.outputs.version, 'rc') }}
        with:
          chatId: ${{ secrets.TAIGA_TELEGRAM_CHAT_ID }}
          topicId: ${{ secrets.TAIGA_TELEGRAM_CHAT_THREAD_ID }}
          token: ${{ secrets.TAIGA_TELEGRAM_BOT_TOKEN }}
          version: v${{ steps.info.outputs.version }}
          textLink: '@taiga-ui/cdk'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
