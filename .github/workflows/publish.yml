name: ⚠️ Publish Taiga UI packages
on:
  push:
    branches: ['release/*']

env:
  NX_DISABLE_NX_CACHE: true
  NX_DISABLE_REMOTE_CACHE: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.0
        with:
          fetch-depth: 0
      - uses: taiga-family/ci/actions/setup/variables@v1.152.0
      - uses: taiga-family/ci/actions/setup/node@v1.152.0
      - uses: taiga-family/ci/actions/setup/config/npm@v1.152.0
        with:
          token: ${{ secrets.TAIGA_UI_SCOPE_NPM_TOKEN }}

      - run: npx nx run-many -t publish

      - uses: taiga-family/ci/actions/run/read-package-json@v1.152.0
        id: info

      # The messenger sits behind a corporate CA that GitHub runners do not trust.
      # The announcement carries no secrets, so we let curl skip verification for
      # this single step instead of provisioning the CA on every runner.
      - name: Allow self-signed certificate of the internal messenger
        run: printf 'insecure\n' > "${{ runner.temp }}/.curlrc"

      - name: Announce to Time messenger
        uses: taiga-family/ci/actions/messenger/time/announce@v1.152.0
        # announcement is not a part of the release: never block merge of a release PR
        continue-on-error: true
        if: ${{ !contains(steps.info.outputs.version, 'rc') }}
        env:
          CURL_HOME: ${{ runner.temp }}
        with:
          url: ${{ secrets.ANNOUNCE_WEBHOOK }}
          channel: ${{ secrets.ANNOUNCE_TARGET }}
          version: v${{ steps.info.outputs.version }}

      - name: Announce to Telegram messenger
        uses: taiga-family/ci/actions/messenger/telegram/announce@v1.152.0
        continue-on-error: true
        if: ${{ !contains(steps.info.outputs.version, 'rc') }}
        with:
          chatId: ${{ secrets.TAIGA_TELEGRAM_CHAT_ID }}
          topicId: ${{ secrets.TAIGA_TELEGRAM_CHAT_THREAD_ID }}
          token: ${{ secrets.TAIGA_TELEGRAM_BOT_TOKEN }}
          version: v${{ steps.info.outputs.version }}
          textLink: '@taiga-ui/cdk'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
