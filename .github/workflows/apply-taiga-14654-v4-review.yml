name: Apply Taiga #14654 v4 review changes

on:
  push:
    branches:
      - fix/v4.x-14654-cleaner-opens-dropdown
    paths:
      - .github/workflows/apply-taiga-14654-v4-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.x-14654-cleaner-opens-dropdown
          fetch-depth: 0

      - name: Apply requested cleaner reuse and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "projects/core/components/textfield/textfield.component.ts",
              "    protected onCleanerClick(): void {\n        this.accessor?.setValue(null);",
              "    protected onCleanerClick(value: T | T[] | null): void {\n        this.accessor?.setValue(value);",
          )

          replace_once(
              "projects/core/components/textfield/textfield.template.html",
              '(click)="onCleanerClick()"',
              '(click)="onCleanerClick(null)"',
          )

          replace_once(
              "projects/core/components/textfield/textfield-multi/textfield-multi.template.html",
              '(click)="accessor?.setValue([])"',
              '(click)="onCleanerClick([])"',
          )

          Path("projects/core/components/textfield/test/textfield-cleaner.spec.ts").write_text(
              """import {TuiTextfieldBaseComponent} from '../textfield.component';

interface CleanerContext {
    readonly accessor?: {setValue(value: unknown): void};
    readonly dropdown: {_content(): unknown};
    readonly dropdownOpen: {
        readonly nativeElement: HTMLElement;
        toggle(open: boolean): void;
    };
}

const onCleanerClick = (
    TuiTextfieldBaseComponent.prototype as unknown as {
        onCleanerClick(this: CleanerContext, value: unknown): void;
    }
).onCleanerClick;

describe('TuiTextfieldBaseComponent cleaner', () => {
    it('forwards the cleaner value and opens an editable dropdown with content', () => {
        const setValue = jest.fn();
        const toggle = jest.fn();
        const value: unknown[] = [];

        onCleanerClick.call(
            {
                accessor: {setValue},
                dropdown: {_content: () => 'content'},
                dropdownOpen: {nativeElement: document.createElement('input'), toggle},
            },
            value,
        );

        expect(setValue).toHaveBeenCalledWith(value);
        expect(toggle).toHaveBeenCalledWith(true);
    });

    it('does not open when dropdown content is absent', () => {
        const toggle = jest.fn();

        onCleanerClick.call(
            {
                accessor: {setValue: jest.fn()},
                dropdown: {_content: () => null},
                dropdownOpen: {nativeElement: document.createElement('input'), toggle},
            },
            null,
        );

        expect(toggle).not.toHaveBeenCalled();
    });

    it('does not open for a readonly dropdown host', () => {
        const input = document.createElement('input');
        const toggle = jest.fn();

        input.readOnly = true;
        onCleanerClick.call(
            {
                accessor: {setValue: jest.fn()},
                dropdown: {_content: () => 'content'},
                dropdownOpen: {nativeElement: input, toggle},
            },
            null,
        );

        expect(toggle).not.toHaveBeenCalled();
    });
});
"""
          )

          replace_once(
              "projects/demo-playwright/tests/kit/input-chip/input-chip.pw.spec.ts",
              "            await inputChip.cleaner.click();\n\n            await expect(inputChip.chips).toHaveCount(0);\n\n            await expect\n                .soft(example)",
              "            await inputChip.input.click();\n            await expect(page.locator('tui-dropdown')).toBeVisible();\n\n            await inputChip.cleaner.click();\n\n            await expect(inputChip.chips).toHaveCount(0);\n            await expect(page.locator('tui-dropdown')).toBeVisible();\n\n            await expect\n                .soft(example)",
          )
          PY

      - name: Commit reviewed changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/core/components/textfield projects/demo-playwright/tests/kit/input-chip/input-chip.pw.spec.ts
          git diff --cached --check
          git commit -m "fix(core): reuse cleaner value for multi textfields"
          git push origin HEAD:fix/v4.x-14654-cleaner-opens-dropdown
