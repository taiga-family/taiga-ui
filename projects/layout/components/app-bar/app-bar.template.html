<tui-progressive-blur *ngIf="liquidGlass" />

<div
    #side
    class="t-side"
>
    <div tuiAppBarButton>
        <ng-content select="[tuiSlot='left']:not([tuiAppBarButton])" />
    </div>
    <ng-content select="[tuiSlot='left'][tuiAppBarButton]" />
</div>
<div
    #title
    tuiFade
    class="t-content"
    [class.t-content_start]="overflown$ | async"
    [style.--t-sides.px]="width$ | async"
>
    <ng-content />
</div>
<div
    #side
    class="t-side"
>
    <div tuiAppBarButton>
        <ng-content select="[tuiSlot='right']:not([tuiAppBarButton])" />
    </div>
    <ng-content select="[tuiSlot='right'][tuiAppBarButton]" />
</div>
