<tui-doc-page
    header="Listbox"
    package="KIT"
    type="components"
>
    <ng-template pageTab>
        <p>
            A persistent selectable list with independent focus and selection. Provide an accessible name with
            <code>aria-label</code>
            or
            <code>aria-labelledby</code>
            . Options can contain text and non-interactive rich content.
        </p>
        <tui-doc-example
            heading="Single, multiple and disabled"
            [component]="1 | tuiComponent"
            [content]="1 | tuiExample"
        />
    </ng-template>
</tui-doc-page>
