<input
    #slider
    aria-label="Container width"
    max="100"
    min="20"
    tuiSlider
    type="range"
    class="slider"
    [value]="width()"
    (input)="width.set(slider.value)"
/>
{{ width() }} %
<div [style.inline-size.%]="width()">
    <tui-arc-chart
        style="--t-size: 100%"
        [value]="value"
    >
        Total value
    </tui-arc-chart>
</div>
