<div
    waIntersectionObserver
    waIntersectionRoot
    class="container"
>
    <h2
        class="title"
        (waIntersectionObservee)="floating.set(!$event[0]?.isIntersecting)"
    >
        Search
    </h2>

    <tui-searchbar
        [appearance]="floating() ? 'floating' : ''"
        (tuiActiveZoneChange)="active.set($event)"
    >
        <input
            #search
            placeholder="Search"
            tuiSearch
        />
        @if (active() && floating()) {
            <button
                iconStart="@tui.x"
                tuiAnimated
                tuiIconButton
                type="button"
                (click)="cancel(search)"
            >
                Cancel
            </button>
        }
    </tui-searchbar>

    @for (_ of '-'.repeat(12); track $index) {
        <div tuiCell>
            <div
                appearance="secondary"
                tuiAvatar="@tui.heart"
            ></div>
            <div tuiTitle>
                Title
                <div tuiSubtitle>Description</div>
            </div>
        </div>
    }
</div>
