<div class="container">
    <header class="header">
        @if (!active()) {
            <tui-app-bar>
                <button
                    title="Back"
                    tuiAppBarBack
                    tuiSlot="start"
                    type="button"
                ></button>
                Taiga UI
            </tui-app-bar>
        }

        <tui-searchbar
            appearance="floating"
            (tuiActiveZoneChange)="active.set($event)"
        >
            <input
                #search
                placeholder="Search"
                tuiSearch
            />
            @if (active()) {
                <button
                    iconStart="@tui.x"
                    tuiAnimated
                    tuiIconButton
                    type="button"
                    (click)="cancel(search)"
                >
                    Cancel
                </button>
            }
        </tui-searchbar>
    </header>

    @for (_ of '-'.repeat(12); track $index) {
        <div tuiCell>
            <div
                appearance="secondary"
                tuiAvatar="@tui.heart"
            ></div>
            <div tuiTitle>
                Title
                <div tuiSubtitle>Description</div>
            </div>
        </div>
    }
</div>
