<tui-searchbar
    appearance="floating"
    (tuiActiveZoneChange)="active.set($event)"
>
    <input
        #search
        placeholder="Search"
        tuiSearch
    />
    @if (active()) {
        <button
            iconStart="@tui.x"
            tuiAnimated
            tuiIconButton
            type="button"
            (click)="cancel(search)"
        >
            Cancel
        </button>
    }
</tui-searchbar>
