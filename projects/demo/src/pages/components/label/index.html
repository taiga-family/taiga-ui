<tui-doc-page
    header="Label"
    package="CORE"
    type="components"
>
    <ng-template pageTab>
        <div>Label is used to show text related to textfields, checkboxes, toggles and radio buttons</div>

        <p>
            Add
            <code>tuiLabelReverse</code>
            to move the label text before a checkbox, radio button or switch.
        </p>

        @for (example of examples; track example) {
            <tui-doc-example
                [component]="$index + 1 | tuiComponent"
                [content]="$index + 1 | tuiExample"
                [heading]="example"
            />
        }
    </ng-template>
</tui-doc-page>
