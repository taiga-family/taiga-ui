<tui-doc-page
    header="Label"
    package="CORE"
    type="components"
>
    <ng-template pageTab>
        <div>Label is used to show text related to textfields, checkboxes, toggles and radio buttons</div>

        @for (example of examples; track example) {
            <tui-doc-example
                [component]="$index + 1 | tuiComponent"
                [content]="$index + 1 | tuiExample"
                [heading]="example"
            />
        }

        <p>
            Set
            <code>flex-direction: row-reverse</code>
            on the label to place its text before a checkbox, radio button or switch.
        </p>
    </ng-template>
</tui-doc-page>
