<tui-textfield>
    <label tuiLabel>Enter 12-hour time format</label>

    <input
        mode="HH:MM"
        tuiInputTime
        [dayPeriod]="['AM', 'PM']"
        [formControl]="control"
    />
</tui-textfield>

<p><strong>Control value:</strong></p>
<pre><code>{{ control.value | json }}</code></pre>
