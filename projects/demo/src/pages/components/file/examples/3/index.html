@for (orientation of orientations; track $index) {
    <div
        tuiFile
        [orientation]="orientation"
    >
        <tui-icon icon="@tui.image" />
        <div tuiTitle>
            <div
                dir="rtl"
                class="truncate"
            >
                A very very long file name.png
            </div>

            <div
                tuiSubtitle
                class="truncate"
            >
                <strong>text-overflow: ellipsis</strong>
                CSS rule allows to truncate text with an ellipsis
            </div>
        </div>
    </div>

    <div
        tuiFile
        [orientation]="orientation"
    >
        <tui-icon icon="@tui.image" />
        <div tuiTitle>
            <div class="clamp">A very very long file name that spans many many lines.png</div>
            <div
                tuiSubtitle
                class="clamp"
            >
                You can use native
                <code>line-clamp</code>
                CSS rule to keep text under a certain number of lines
            </div>
        </div>
    </div>
}
