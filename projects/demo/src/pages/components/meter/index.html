<tui-doc-page
    header="Meter"
    package="KIT"
    type="components"
>
    <ng-template pageTab>
        <p>Native styled Meter tag, using the same attributes as native version.</p>

        @for (example of ['Increasing', 'Decreasing']; track example) {
            <tui-doc-example
                [component]="$index + 1 | tuiComponent"
                [content]="$index + 1 | tuiExample"
                [heading]="example"
            />
        }
    </ng-template>
</tui-doc-page>
