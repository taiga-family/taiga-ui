<div class="content">
    @for (_ of '-'.repeat(30); track $index) {
        <div tuiCell>
            <div
                appearance="primary"
                tuiAvatar="@tui.star"
            ></div>
            <div tuiTitle>
                Title
                <div tuiSubtitle>Description</div>
            </div>
        </div>
    }

    <footer tuiFloatingContainer>
        <button
            tuiButton
            type="button"
        >
            Main action
        </button>
        <button
            appearance="flat"
            tuiButton
            type="button"
        >
            Secondary action
        </button>
    </footer>
</div>
