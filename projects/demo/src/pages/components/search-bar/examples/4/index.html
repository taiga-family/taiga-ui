<header class="header">
    @if (!active()) {
        <tui-app-bar>
            <button
                title="Back"
                tuiAppBarBack
                tuiSlot="start"
                type="button"
            ></button>
            Taiga UI
        </tui-app-bar>
    }

    <search>
        <form
            appearance="floating"
            tuiSearchBar
            (tuiActiveZoneChange)="active.set($event)"
        >
            <input
                placeholder="Search"
                tuiSearchBar
            />
            @if (active()) {
                <button
                    tuiAnimated
                    tuiButtonX
                    type="reset"
                    (click)="active.set(false)"
                >
                    Cancel
                </button>
            }
        </form>
    </search>
</header>

@for (_ of '-'.repeat(12); track $index) {
    <div tuiCell>
        <div
            appearance="secondary"
            tuiAvatar="@tui.heart"
        ></div>
        <div tuiTitle>
            Title
            <div tuiSubtitle>Description</div>
        </div>
    </div>
}
