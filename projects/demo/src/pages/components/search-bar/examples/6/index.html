<h2
    class="title"
    (waIntersectionObservee)="floating.set(!$event[0]?.isIntersecting)"
>
    Search
</h2>

<search>
    <form
        tuiSearchBar
        [appearance]="floating() ? 'floating' : 'neutral'"
        [class.tui-liquid-glass_blur]="floating()"
    >
        <input
            placeholder="Search"
            tuiSearchBar
        />
        <button
            tuiButtonX
            type="reset"
        >
            Cancel
        </button>
    </form>
</search>

@for (_ of '-'.repeat(12); track $index) {
    <div tuiCell>
        <div
            appearance="secondary"
            tuiAvatar="@tui.heart"
        ></div>
        <div tuiTitle>
            Title
            <div tuiSubtitle>Description</div>
        </div>
    </div>
}
