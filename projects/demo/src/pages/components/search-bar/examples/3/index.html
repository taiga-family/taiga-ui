<search>
    <form
        appearance="floating"
        tuiSearchBar
        (ngSubmit)="onSubmit()"
    >
        <input
            name="query"
            placeholder="Search"
            tuiSearchBar
            [(ngModel)]="query"
        />
        <button
            tuiButtonX
            type="reset"
            (click)="onCancel()"
        >
            Cancel
        </button>
    </form>
</search>
