<search>
    <form
        appearance="floating"
        tuiSearchBar
        (ngSubmit)="onSubmit()"
        (tuiActiveZoneChange)="active.set($event)"
    >
        <input
            name="query"
            placeholder="Search"
            tuiSearchBar
            [(ngModel)]="query"
        />
        @if (active()) {
            <button
                tuiAnimated
                tuiButtonX
                type="reset"
                (click)="active.set(false)"
            >
                Cancel
            </button>
        }
    </form>
</search>
