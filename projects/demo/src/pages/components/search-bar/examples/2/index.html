<search tuiSearchBar>
    <input
        placeholder="Search"
        tuiSearchBar
        [formControl]="query"
        (tuiActiveZoneChange)="active.set($event)"
    />
    @if (active()) {
        <button
            tuiButtonX
            (click)="onCancel()"
        >
            Cancel
        </button>
    }
</search>
