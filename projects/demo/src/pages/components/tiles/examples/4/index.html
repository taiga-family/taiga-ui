<div
    class="table"
    role="table"
>
    <div
        class="header"
        role="row"
    >
        <span
            aria-label="Reorder"
            role="columnheader"
        ></span>
        <span role="columnheader">Name</span>
        <span role="columnheader">Role</span>
        <span role="columnheader">Email</span>
    </div>

    <tui-tiles
        class="tiles"
        role="rowgroup"
        [(order)]="order"
    >
        @for (item of items; track item) {
            <tui-tile [style.order]="order.get($index)">
                <div
                    class="row"
                    role="row"
                >
                    <span role="cell">
                        <tui-icon
                            icon="@tui.grip-vertical"
                            tuiTileHandle
                            class="handle"
                        />
                    </span>
                    <span
                        class="cell"
                        role="cell"
                    >
                        {{ item.name }}
                    </span>
                    <span
                        class="cell"
                        role="cell"
                    >
                        {{ item.role }}
                    </span>
                    <span
                        class="cell"
                        role="cell"
                    >
                        {{ item.email }}
                    </span>
                </div>
            </tui-tile>
        }
    </tui-tiles>
</div>
