<button
    appearance="secondary"
    tuiButton
    type="button"
    (click)="expanded.update((value) => !value)"
>
    {{ expanded() ? 'Show overflow' : 'Show full text' }}
</button>
<div
    tuiFade
    tuiHintOverflow
    class="fade"
    [class.fade_expanded]="expanded()"
>
    The tooltip appears only when text overflows
</div>
