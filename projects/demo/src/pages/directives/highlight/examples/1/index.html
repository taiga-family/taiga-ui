<tui-textfield iconStart="@tui.search">
    <input
        tuiInput
        [(ngModel)]="search"
    />
    <label tuiLabel>Search</label>
</tui-textfield>

<table>
    <thead>
        <tr>
            <th>Member</th>
            <th>Nickname</th>
            <th>Fate</th>
        </tr>
    </thead>
    <tbody>
        @for (row of rows; track row) {
            <tr>
                @for (cell of row; track cell) {
                    <td
                        tuiHighlightColor="#228B22"
                        [tuiHighlight]="search"
                    >
                        {{ cell }}
                    </td>
                }
            </tr>
        }
    </tbody>
</table>
