<div class="tui-space_vertical-4">
    <button
        id="arrow-offset-centered"
        style="width: 36px; height: 36px"
        tuiHint="Centered arrow"
        tuiHintDirection="top-start"
        type="button"
        [tuiHintShowDelay]="0"
    >
        36
    </button>
</div>
<div class="tui-space_vertical-4">
    <button
        id="arrow-offset-start"
        style="width: 100px; height: 36px"
        tuiHint="Start-aligned arrow"
        tuiHintDirection="top-start"
        type="button"
        [tuiHintCentered]="false"
        [tuiHintShowDelay]="0"
    >
        100px
    </button>
</div>
