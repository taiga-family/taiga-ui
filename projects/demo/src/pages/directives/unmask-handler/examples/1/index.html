<tui-textfield class="tui-space_bottom-4">
    <label tuiLabel>Date</label>
    <input
        tuiInput
        [formControl]="control"
        [maskito]="options"
        [tuiUnmaskHandler]="unmask"
    />
</tui-textfield>

<p>
    Form control value (unmasked):
    <code>{{ control.value }}</code>
</p>
