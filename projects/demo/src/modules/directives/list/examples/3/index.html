<header tuiHeader="h6">
    <hgroup tuiTitle>
        <h1>Regular</h1>
    </hgroup>
</header>
<dl tuiList>
    <ng-container *ngFor="let item of data | keyvalue">
        <dt>{{ item.key }}</dt>
        <dd>{{ item.value }}</dd>
    </ng-container>
</dl>
<br />
<header tuiHeader="h6">
    <hgroup tuiTitle>
        <h1>Compact</h1>
    </hgroup>
</header>
<dl
    compact
    tuiList="m"
>
    <ng-container *ngFor="let item of data | keyvalue">
        <dt>{{ item.key }}</dt>
        <dd>{{ item.value }}</dd>
    </ng-container>
</dl>
