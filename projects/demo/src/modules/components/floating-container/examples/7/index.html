<div class="content">
    <div
        *tuiRepeatTimes="let i of 30"
        tuiCell
    >
        <tui-avatar
            appearance="primary"
            src="@tui.star"
        />
        <div tuiTitle>
            Title
            <div tuiSubtitle>Description</div>
        </div>
    </div>

    <footer tuiFloatingContainer>
        <button
            tuiButton
            type="button"
        >
            Main action
        </button>
        <button
            appearance="flat"
            tuiButton
            type="button"
        >
            Secondary action
        </button>
    </footer>
</div>
