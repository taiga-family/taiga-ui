<div
    tuiCardLarge
    tuiSurface="floating"
>
    <h3 tuiTitle="m">Inside a block</h3>
    <button
        *ngFor="let item of items"
        tuiCell
        tuiCellStretch
        tuiRipple
        type="button"
    >
        <tui-avatar
            appearance="accent"
            [src]="item.icon"
        />
        <span tuiTitle>
            {{ item.title }}
            <span tuiSubtitle>{{ item.subtitle }}</span>
        </span>
    </button>
</div>
