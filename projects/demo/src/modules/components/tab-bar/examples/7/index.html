<nav
    tuiTabBar
    [activeItemIndex]="activeItemIndex"
    (activeItemIndexChange)="onIndexChange($event)"
>
    <button
        *ngFor="let item of items"
        tuiTabBarItem
        type="button"
        [badge]="item.badge"
        [icon]="item.icon"
    >
        {{ item.text }}
    </button>
</nav>
