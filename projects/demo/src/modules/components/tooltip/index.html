<tui-doc-page
    header="Tooltip"
    package="KIT"
    path="kit/directives/tooltip"
    type="components"
>
    <ng-template pageTab>
        <p>Component to show icons with a hint by hover</p>

        <tui-doc-example
            id="example-base"
            heading="Basic"
            [component]="1 | tuiComponent"
            [content]="1 | tuiExample"
        />
        <tui-doc-example
            id="custom-host"
            heading="Custom host"
            [component]="2 | tuiComponent"
            [content]="2 | tuiExample"
        />
        <tui-doc-example
            id="repeating-template"
            heading="Repeating template"
            [component]="3 | tuiComponent"
            [content]="3 | tuiExample"
        />
        <tui-doc-example
            id="options"
            heading="Options"
            [component]="4 | tuiComponent"
            [content]="4 | tuiExample"
        />
        <tui-doc-example
            id="visibility"
            heading="Visibility"
            [component]="5 | tuiComponent"
            [content]="5 | tuiExample"
        />
    </ng-template>

    <ng-template pageTab>
        <tui-doc-demo>
            <tui-icon
                [size]="size"
                [tuiHintAppearance]="appearance"
                [tuiHintDirection]="direction"
                [tuiTooltip]="content"
            />
        </tui-doc-demo>
        <tui-doc-documentation>
            <ng-template
                documentationPropertyMode="input"
                documentationPropertyName="tuiTooltip"
                documentationPropertyType="PolymorpheusContent"
                [(documentationPropertyValue)]="content"
            >
                Content
            </ng-template>
            <ng-template
                documentationPropertyMode="input"
                documentationPropertyName="size"
                documentationPropertyType="TuiSizeS"
                [documentationPropertyValues]="sizeVariants"
                [(documentationPropertyValue)]="size"
            >
                Size
            </ng-template>
        </tui-doc-documentation>
        <inherited-documentation
            [withHint]="false"
            [withTextFieldController]="false"
        />
    </ng-template>

    <tui-setup *pageTab="'Setup'" />
</tui-doc-page>
