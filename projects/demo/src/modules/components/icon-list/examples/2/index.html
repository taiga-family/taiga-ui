<tui-textfield
    tuiChevron
    class="t-field"
    [stringify]="stringify"
    [tuiDropdownLimitWidth]="'auto'"
>
    <input
        placeholder="Pick an emoji"
        tuiSelect
        [(ngModel)]="value"
    />

    <div
        *tuiTextfieldDropdown
        class="t-panel"
    >
        <div class="nav-block">
            <!--
            Read through (input) rather than ngModel: inside the dropdown of
            another textfield ngModel on the inner one never fires.
        -->
            <tui-textfield
                iconStart="@tui.search"
                tuiTextfieldSize="s"
            >
                <input
                    placeholder="Search"
                    tuiTextfield
                    (input)="query.set($any($event.target).value)"
                />
            </tui-textfield>

            <nav
                size="m"
                tuiTabs
                class="t-tabs"
                [tuiIconTabs]="list"
            >
                <button
                    *ngFor="let group of groups()"
                    tuiTab
                    type="button"
                    [attr.aria-label]="group.label"
                >
                    <tui-icon [icon]="group.icon" />
                </button>
            </nav>
        </div>

        <tui-icon-list
            #list="tuiIconList"
            class="list"
        >
            <tui-icon-group
                *ngFor="let group of groups()"
                [label]="group.label"
            >
                <button
                    *ngFor="let item of group.items"
                    new
                    tuiIconOption
                    tuiOption
                    type="button"
                    [attr.aria-label]="item.name"
                    [value]="item"
                >
                    {{ item.value }}
                </button>
            </tui-icon-group>
        </tui-icon-list>
    </div>
</tui-textfield>
