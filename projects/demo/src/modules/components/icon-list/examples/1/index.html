<p class="t-picked">{{ picked?.value || '—' }} {{ picked?.name }}</p>

<tui-icon-list class="icon-list">
    <button
        *ngFor="let item of emoji"
        tuiIconOption
        type="button"
        [attr.aria-label]="item.name"
        (click)="picked = item"
    >
        {{ item.value }}
    </button>
</tui-icon-list>
