<tr>
    <td colspan="3">
        <span tuiTitle>
            <strong>TuiTimeFormat</strong>
            <div tuiSubtitle>
                <code>[tuiTimeFormat]="&#123;dayPeriod&#125;"</code>
            </div>
        </span>
    </td>
</tr>

<tr
    name="[dayPeriod]"
    tuiDocAPIItem
    type="readonly [string, string]"
    [items]="dayPeriodVariants"
    [(value)]="dayPeriod"
>
    Tuple of two locale-specific day-period markers (AM-marker first, PM-marker second). When both are non-empty, the
    mask switches to 12-hour format and appends the selected marker to the time.
    <p class="tui-space_bottom-0">
        Default:
        <code>['', '']</code>
        (24-hour format)
    </p>
</tr>
