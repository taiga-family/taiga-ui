<button
    appearance="secondary-grayscale"
    size="s"
    tuiButton
    type="button"
    class="t-action"
    [iconStart]="icon()"
    (click)="copy()"
>
    {{ copied() ? texts()[1] : texts()[0] }}
</button>
<button
    appearance="secondary-grayscale"
    size="s"
    tuiDropdown
    tuiDropdownAlign="end"
    tuiIconButton
    type="button"
    class="t-toggle"
    [iconStart]="icons.dropdown"
    [(tuiDropdownOpen)]="open"
>
    {{ texts()[2] }}
    <tui-data-list
        *tuiDropdown
        size="s"
    >
        <a
            rel="noreferrer"
            target="_blank"
            tuiOption
            [href]="url()"
            (click)="open.set(false)"
        >
            {{ texts()[3] }}
        </a>
    </tui-data-list>
</button>
