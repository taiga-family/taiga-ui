@if (enabled() && markdown()) {
    <div
        tuiGroup
        [tuiDropdown]="menu"
        [(tuiDropdownOpen)]="open"
    >
        <button
            appearance="flat-grayscale"
            size="s"
            tuiButton
            type="button"
            class="t-action"
            [iconStart]="icons.copy"
            (click)="copy()"
        >
            {{ copied() ? 'Copied!' : 'Copy page' }}
        </button>
        <button
            #tuiDropdownHost
            appearance="flat-grayscale"
            size="s"
            tuiIconButton
            type="button"
            class="t-toggle"
            [iconStart]="icons.chevron"
        >
            More
        </button>
    </div>
    <ng-template #menu>
        <tui-data-list>
            <a
                rel="noreferrer"
                target="_blank"
                tuiOption
                [href]="markdownUrl()"
            >
                View as Markdown
            </a>
        </tui-data-list>
    </ng-template>
}
