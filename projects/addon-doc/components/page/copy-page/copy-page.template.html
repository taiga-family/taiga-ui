@if (markdown()) {
    <div class="t-copy-page">
        <button
            tuiButton
            appearance="flat"
            size="s"
            type="button"
            class="t-action"
            [iconStart]="icons.copy"
            (click)="copy()"
        >
            {{ copied() ? 'Copied!' : 'Copy page' }}
        </button>
        <span
            aria-hidden="true"
            class="t-divider"
        ></span>
        <button
            tuiIconButton
            appearance="flat"
            size="s"
            type="button"
            class="t-toggle"
            [iconStart]="icons.chevron"
            [tuiDropdown]="menu"
            [tuiDropdownManual]="open()"
            (click)="open.set(!open())"
            (tuiActiveZoneChange)="onActiveZone($event)"
        >
            More
        </button>
    </div>
    <ng-template #menu>
        <tui-data-list>
            <button
                tuiOption
                type="button"
                (click)="viewAsMarkdown()"
            >
                View as Markdown
            </button>
        </tui-data-list>
    </ng-template>
}
