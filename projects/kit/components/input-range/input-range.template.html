<tui-textfield
    [content]="contentStartHidden ? '' : contentStart()"
    [invalid]="invalid()"
>
    <label tuiLabel>
        <ng-content />
    </label>

    <input
        tuiInputNumber
        [disabled]="disabled()"
        [max]="value()[1]"
        [min]="min()"
        [ngModelOptions]="{standalone: true}"
        [postfix]="postfix()[0]"
        [prefix]="prefix()[0]"
        [readonly]="readonly()"
        [(ngModel)]="start"
        (blur)="onBlur()"
        (keydown.arrowDown)="takeStep($event, [-1, 0])"
        (keydown.arrowUp)="takeStep($event, [1, 0])"
        (ngModelChange)="onInput([$event, null])"
    />

    <input
        tuiInputNumber
        class="t-end"
        [class._hidden]="!contentEndHidden || !this.interactive()"
        [disabled]="disabled()"
        [max]="max()"
        [min]="value()[0]"
        [ngModelOptions]="{standalone: true}"
        [postfix]="postfix()[1]"
        [prefix]="prefix()[1]"
        [readonly]="readonly()"
        [(ngModel)]="end"
        (blur)="onBlur()"
        (keydown.arrowDown)="takeStep($event, [0, -1])"
        (keydown.arrowUp)="takeStep($event, [0, 1])"
        (ngModelChange)="onInput([null, $event])"
    />

    @if (!contentEndHidden && contentEnd()) {
        <div class="t-content-end">
            <ng-container *polymorpheusOutlet="contentEnd() as text; context: {$implicit: value()[1]}">
                {{ text }}
            </ng-container>
        </div>
    }

    @if (interactive()) {
        <tui-range
            [focusable]="false"
            [keySteps]="keySteps()"
            [max]="max()"
            [min]="min()"
            [ngModel]="value()"
            [ngModelOptions]="{standalone: true}"
            [segments]="segments()"
            [step]="step()"
            (activeThumbChange)="side = $event"
            (ngModelChange)="onExternalValueUpdate($event)"
            (pointerdown.prevent.stop)="focusToTextfield()"
        />
    }
</tui-textfield>
