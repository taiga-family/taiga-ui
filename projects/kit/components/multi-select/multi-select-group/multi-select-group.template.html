@if (values().length) {
    @if (label() == null) {
        <button
            tuiOption
            type="button"
            [attr.aria-checked]="indeterminate() ? 'mixed' : checked()"
            (click)="toggle()"
        >
            <input
                aria-hidden="true"
                tuiCheckbox
                type="checkbox"
                [checked]="checked()"
                [indeterminate]="indeterminate()"
                [size]="size() === 'l' ? 'm' : 's'"
            />
            {{ texts().all }}
        </button>
    } @else {
        <span class="t-label">
            {{ label() }}
            <button
                tuiLink
                type="button"
                class="t-button"
                (click)="toggle()"
            >
                {{ texts()[checked() ? 'none' : 'all'] }}
            </button>
        </span>
    }
}
<ng-content />
