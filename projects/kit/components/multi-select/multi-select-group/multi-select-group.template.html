@if (values().length) {
    @if (label() == null) {
        <button
            tuiOption
            type="button"
            [indeterminate]="indeterminate()"
            [tuiMultiSelectOption]="checked()"
            (click)="toggle()"
        >
            {{ texts().all }}
        </button>
    } @else {
        <span class="t-label">
            {{ label() }}
            <button
                tuiLink
                type="button"
                class="t-button"
                (click)="toggle()"
            >
                {{ texts()[checked() ? 'none' : 'all'] }}
            </button>
        </span>
    }
}
<ng-content />
